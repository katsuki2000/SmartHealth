server {
    listen 5000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy pour le backend si nécessaire
    # location /api {
    #     proxy_pass http://ingestion-service:3000;
    # }
}
